<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<nav th:fragment="sidebar" class="sidebar d-flex flex-column">
    <div class="sidebar-brand">
        <i class="bi bi-lightning-charge-fill me-2"></i>Freelix
    </div>

    <!-- CLIENT nav -->
    <ul sec:authorize="hasRole('CLIENT')" class="sidebar-nav">
        <li><a th:href="@{/client/dashboard}" th:classappend="${currentUri.contains('/client/dashboard')} ? 'active'">
            <i class="bi bi-speedometer2"></i> Dashboard
        </a></li>
        <li><a th:href="@{/client/projects}" th:classappend="${currentUri.contains('/client/projects')} ? 'active'">
            <i class="bi bi-folder2-open"></i> My Projects
        </a></li>
        <li><a th:href="@{/client/projects/new}">
            <i class="bi bi-plus-circle"></i> Post Project
        </a></li>
        <li><a th:href="@{/messages}" th:classappend="${currentUri.contains('/messages') or currentUri.contains('/chat')} ? 'active'" class="d-flex align-items-center justify-content-between">
            <span><i class="bi bi-chat-dots"></i> Messages</span>
            <span th:if="${unreadMessages > 0}" class="sidebar-badge" th:text="${unreadMessages}"></span>
        </a></li>
        <li><a th:href="@{/notifications}" th:classappend="${currentUri.contains('/notifications')} ? 'active'" class="d-flex align-items-center justify-content-between">
            <span><i class="bi bi-bell"></i> Notifications</span>
            <span th:if="${unreadNotifications > 0}" class="sidebar-badge" th:text="${unreadNotifications}"></span>
        </a></li>
        <li><a th:href="@{/profile}" th:classappend="${currentUri.contains('/profile')} ? 'active'">
            <i class="bi bi-person-circle"></i> Profile
        </a></li>
    </ul>

    <!-- FREELANCER nav -->
    <ul sec:authorize="hasRole('FREELANCER')" class="sidebar-nav">
        <li><a th:href="@{/freelancer/dashboard}" th:classappend="${currentUri.contains('/freelancer/dashboard')} ? 'active'">
            <i class="bi bi-speedometer2"></i> Dashboard
        </a></li>
        <li><a th:href="@{/freelancer/browse}" th:classappend="${currentUri.contains('/browse')} ? 'active'">
            <i class="bi bi-search"></i> Browse Projects
        </a></li>
        <li><a th:href="@{/freelancer/applications}" th:classappend="${currentUri.contains('/applications')} ? 'active'">
            <i class="bi bi-file-earmark-text"></i> My Applications
        </a></li>
        <li><a th:href="@{/messages}" th:classappend="${currentUri.contains('/messages') or currentUri.contains('/chat')} ? 'active'" class="d-flex align-items-center justify-content-between">
            <span><i class="bi bi-chat-dots"></i> Messages</span>
            <span th:if="${unreadMessages > 0}" class="sidebar-badge" th:text="${unreadMessages}"></span>
        </a></li>
        <li><a th:href="@{/notifications}" th:classappend="${currentUri.contains('/notifications')} ? 'active'" class="d-flex align-items-center justify-content-between">
            <span><i class="bi bi-bell"></i> Notifications</span>
            <span th:if="${unreadNotifications > 0}" class="sidebar-badge" th:text="${unreadNotifications}"></span>
        </a></li>
        <li><a th:href="@{/profile}" th:classappend="${currentUri.contains('/profile')} ? 'active'">
            <i class="bi bi-person-circle"></i> Profile
        </a></li>
    </ul>

    <!-- ADMIN nav -->
    <ul sec:authorize="hasRole('ADMIN')" class="sidebar-nav">
        <li><a th:href="@{/admin/dashboard}" th:classappend="${currentUri.contains('/admin/dashboard')} ? 'active'">
            <i class="bi bi-speedometer2"></i> Dashboard
        </a></li>
        <li><a th:href="@{/admin/users}" th:classappend="${currentUri.contains('/admin/users')} ? 'active'">
            <i class="bi bi-people"></i> All Users
        </a></li>
        <li><a th:href="@{/admin/projects}" th:classappend="${currentUri.contains('/admin/projects')} ? 'active'">
            <i class="bi bi-collection"></i> All Projects
        </a></li>
    </ul>

    <div class="sidebar-footer mt-auto">
        <button class="btn btn-sm btn-outline-light w-100 mb-2" id="darkModeToggle" onclick="toggleDarkMode()">
            <i class="bi bi-moon-stars"></i> Dark Mode
        </button>
        <a th:href="@{/logout}" class="btn btn-sm btn-danger w-100">
            <i class="bi bi-box-arrow-right"></i> Logout
        </a>
    </div>
</nav>
<style>
.sidebar-badge {
    background:var(--primary,#6366f1);color:#fff;
    border-radius:999px;padding:1px 7px;font-size:.72rem;font-weight:700;
    min-width:20px;text-align:center;line-height:1.6;
}
</style>
</body>
</html>
