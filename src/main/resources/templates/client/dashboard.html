<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/head :: head('Client Dashboard')}"></head>
<body>
<div class="app-layout">
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    <main class="main-content">
        <div class="page-header">
            <div>
                <h1 class="page-title">Client Dashboard</h1>
                <p class="page-subtitle">Welcome back, <span th:text="${user.name}"></span>!</p>
            </div>
            <a th:href="@{/client/projects/new}" class="btn btn-primary">
                <i class="bi bi-plus-circle me-2"></i>Post New Project
            </a>
        </div>

        <div th:if="${success}" class="alert alert-success alert-dismissible fade show">
            <i class="bi bi-check-circle me-2"></i><span th:text="${success}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <!-- Stats Cards -->
        <div class="stats-grid">
            <div class="stat-card stat-blue">
                <div class="stat-icon"><i class="bi bi-folder2-open"></i></div>
                <div class="stat-info">
                    <div class="stat-value" th:text="${totalProjects}">0</div>
                    <div class="stat-label">Total Projects</div>
                </div>
            </div>
            <div class="stat-card stat-green">
                <div class="stat-icon"><i class="bi bi-circle"></i></div>
                <div class="stat-info">
                    <div class="stat-value" th:text="${openProjects}">0</div>
                    <div class="stat-label">Open</div>
                </div>
            </div>
            <div class="stat-card stat-yellow">
                <div class="stat-icon"><i class="bi bi-arrow-repeat"></i></div>
                <div class="stat-info">
                    <div class="stat-value" th:text="${inProgressProjects}">0</div>
                    <div class="stat-label">In Progress</div>
                </div>
            </div>
            <div class="stat-card stat-purple">
                <div class="stat-icon"><i class="bi bi-check-circle"></i></div>
                <div class="stat-info">
                    <div class="stat-value" th:text="${completedProjects}">0</div>
                    <div class="stat-label">Completed</div>
                </div>
            </div>
        </div>

        <!-- Recent Projects -->
        <div class="section-card">
            <div class="section-header">
                <h3><i class="bi bi-clock-history me-2"></i>Recent Projects</h3>
                <a th:href="@{/client/projects}" class="btn btn-sm btn-outline-primary">View All</a>
            </div>
            <div th:if="${#lists.isEmpty(projects)}" class="empty-state">
                <i class="bi bi-folder-plus"></i>
                <p>No projects yet. Post your first project!</p>
                <a th:href="@{/client/projects/new}" class="btn btn-primary mt-2">Post a Project</a>
            </div>
            <div th:unless="${#lists.isEmpty(projects)}" class="table-responsive">
                <table class="table table-hover freelix-table">
                    <thead>
                        <tr><th>Project</th><th>Budget</th><th>Status</th><th>Posted</th><th>Actions</th></tr>
                    </thead>
                    <tbody>
                        <tr th:each="project, iter : ${projects}" th:if="${iter.index < 5}">
                            <td>
                                <div class="fw-semibold" th:text="${project.title}"></div>
                                <small class="text-muted" th:text="${#strings.abbreviate(project.description, 60)}"></small>
                            </td>
                            <td><span class="badge bg-success">₹<span th:text="${project.budget}"></span></span></td>
                            <td>
                                <span class="status-badge"
                                      th:classappend="${project.status?.name() == 'OPEN'} ? 'status-open' :
                                                      (${project.status?.name() == 'IN_PROGRESS'} ? 'status-progress' :
                                                      (${project.status?.name() == 'PAID'} ? 'status-paid' : 'status-completed'))"
                                      th:text="${project.status}"></span>
                            </td>
                            <td><small th:text="${#temporals.format(project.createdAt, 'dd MMM yyyy')}"></small></td>
                            <td>
                                <a th:href="@{/client/projects/{id}/applicants(id=${project.id})}" class="btn btn-sm btn-outline-primary">
                                    <i class="bi bi-people"></i>
                                </a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</div>
<div th:replace="~{fragments/scripts :: scripts}"></div>
</body>
</html>
