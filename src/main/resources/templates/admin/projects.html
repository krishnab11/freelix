<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Admin — All Projects')}"></head>
<body>
<div class="app-layout">
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    <main class="main-content">
        <div class="page-header">
            <div>
                <h1 class="page-title">All Projects</h1>
                <p class="page-subtitle">Total: <span th:text="${#lists.size(projects)}"></span> projects</p>
            </div>
        </div>
        <div class="section-card">
            <div class="table-responsive">
                <table class="table table-hover freelix-table">
                    <thead>
                        <tr><th>#</th><th>Title</th><th>Client</th><th>Freelancer</th>
                            <th>Budget</th><th>Status</th><th>Posted</th></tr>
                    </thead>
                    <tbody>
                        <tr th:each="p, iter : ${projects}">
                            <td th:text="${iter.count}"></td>
                            <td>
                                <div class="fw-semibold" th:text="${p.title}"></div>
                                <small class="text-muted" th:text="${p.category}"></small>
                            </td>
                            <td th:text="${p.client.name}"></td>
                            <td th:text="${p.selectedFreelancer != null ? p.selectedFreelancer.name : '—'}"></td>
                            <td class="text-success fw-bold">₹<span th:text="${p.budget}"></span></td>
                            <td>
                                <span class="status-badge"
                                      th:classappend="${p.status.name() == 'OPEN'} ? 'status-open' :
                                                      (${p.status.name() == 'IN_PROGRESS'} ? 'status-progress' :
                                                      (${p.status.name() == 'PAID'} ? 'status-paid' : 'status-completed'))"
                                      th:text="${p.status}"></span>
                            </td>
                            <td><small th:text="${#temporals.format(p.createdAt, 'dd MMM yyyy')}"></small></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</div>
<div th:replace="~{fragments/scripts :: scripts}"></div>
</body>
</html>
