<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Error')}"></head>
<body class="auth-body">
<div class="auth-container">
    <div class="auth-card" style="max-width:500px;text-align:center">
        <div class="auth-logo">
            <i class="bi bi-lightning-charge-fill"></i>
            <span>Freelix</span>
        </div>
        <div style="font-size:4rem;margin-bottom:1rem">
            <i class="bi bi-exclamation-triangle-fill" style="color:#f8961e"></i>
        </div>
        <h2 style="color:#fff" th:text="${status != null} ? 'Error ' + ${status} : 'Something went wrong'">Error</h2>
        <p style="color:rgba(255,255,255,0.6)" th:text="${message ?: 'An unexpected error occurred. Please try again.'}">
            An unexpected error occurred.
        </p>
        <div class="mt-4 d-flex gap-2 justify-content-center">
            <a href="javascript:history.back()" class="btn btn-outline-light">
                <i class="bi bi-arrow-left me-2"></i>Go Back
            </a>
            <a th:href="@{/dashboard}" class="btn btn-primary">
                <i class="bi bi-house me-2"></i>Dashboard
            </a>
        </div>
    </div>
</div>
<div th:replace="~{fragments/scripts :: scripts}"></div>
</body>
</html>
